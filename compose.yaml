services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A serigraff_backend worker --loglevel=info
    environment:
      REDIS_HOST: redis
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
