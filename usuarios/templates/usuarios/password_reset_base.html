<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Recuperar contraseña | Serigraff</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f5f9; color: #172638; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(92%, 500px); margin: 8vh auto; background: white; border-radius: 20px; padding: clamp(24px, 5vw, 40px); box-shadow: 0 12px 40px #17263812; }
    .brand { color: #1765ab; font-weight: 900; letter-spacing: 2px; }
    h1 { font-size: 26px; line-height: 1.25; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #6b7785; border-radius: 8px; font: inherit; }
    input:focus { outline: 3px solid #9ed2ff; }
    button { width: 100%; border: 0; border-radius: 9px; padding: 14px; margin-top: 20px; color: white; background: #155ba0; font: inherit; cursor: pointer; }
    .errorlist { color: #a32121; padding-left: 20px; }
    .helptext { font-size: 14px; color: #465566; }
    .helptext ul { padding-left: 20px; }
  </style>
</head>
<body><main><p class="brand">SERIGRAFF</p>{% block content %}{% endblock %}</main></body>
</html>
